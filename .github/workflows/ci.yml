# Pruebas en cada cambio. La página se publica SOLO si todo pasa.
name: Pruebas y publicación

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pruebas:
    name: Pruebas automáticas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Sintaxis de todos los archivos
        run: for f in js/*.js js/views/*.js sw.js; do node --check "$f"; done
      - name: Tipos (TypeScript) de toda la app y del service worker
        run: npm run types
      - name: Cálculos, carta online, Mercado Pago, sincronización y utilidades
        run: node --test tests/*.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Tipos de las funciones del servidor (Deno)
        run: deno check --node-modules-dir=none supabase/functions/*/index.ts
      - name: Sin credenciales en el código
        run: |
          # claves secretas nuevas (sb_secret_) o tokens JWT de servicio ("service_role" en base64)
          if grep -rInE "sb_secret_|c2VydmljZV9yb2xl|APP_USR-[0-9]{6,}" --include=*.js --include=*.ts --include=*.html --exclude-dir=vendor --exclude-dir=node_modules --exclude-dir=.git . ; then
            echo "Se encontró una clave privada en el código"; exit 1
          fi

  publicar:
    name: Publicar en GitHub Pages
    needs: pruebas
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Armar solo los archivos del sitio
        run: |
          mkdir _site
          cp -r index.html carta.html landing.html reparto.html manifest.webmanifest sw.js css js img vendor _site/
          # Cada publicación pide archivos con la versión nueva: ningún celular
          # mezcla archivos viejos (guardados) con nuevos.
          V="${GITHUB_SHA::8}"
          for page in index.html carta.html landing.html reparto.html; do
            sed -i -E "s#(src|href)=\"((js|css|vendor)/[^\"?]+\.(js|css))\"#\1=\"\2?v=$V\"#g" "_site/$page"
            grep -c "?v=$V" "_site/$page"
          done
          sed -i "s#const CACHE = 'pizzeria-#const CACHE = 'pizzeria-$V-#" _site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
